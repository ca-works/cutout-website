version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let new releases age a week before proposing them
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # @astrojs/check 0.9.x accepts TypeScript 5 or 6 only; revisit when it supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
